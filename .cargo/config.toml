# jxl-oxide lists testdata submodules this build does not need.
# Cargo reads this file from the mjxl root, including when the still
# codec is compiled from third_party/o3-jxl.
[net]
git-fetch-with-cli = true

[env]
GIT_CONFIG_COUNT = "2"
GIT_CONFIG_KEY_0 = "fetch.recurseSubmodules"
GIT_CONFIG_VALUE_0 = "false"
GIT_CONFIG_KEY_1 = "clone.recurseSubmodules"
GIT_CONFIG_VALUE_1 = "false"
